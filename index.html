<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="스페인어 동사">
<title>스페인어 동사변형 · 하루 20분</title>
<style>
  :root{
    --bg:#FBF6EF; --card:#FFFFFF; --ink:#33261F; --ink2:#7A6A5F; --line:#EDE2D6;
    --accent:#C9613C; --accent2:#A64B2C; --accent-soft:#FBEDE6;
    --teal:#2F7E7A; --teal-soft:#E4F1F0; --teal-line:#BFDDDA;
    --ok:#2E7D5B; --ok-soft:#E6F4EC; --bad:#B63A2B; --bad-soft:#FDECEA; --gold:#C8912F;
    --soft:#FCF7F1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);
    font-size:16px;line-height:1.62;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(94px + env(safe-area-inset-bottom));
  }
  .app{max-width:480px;margin:0 auto;padding:0 16px}

  /* ---------- header ---------- */
  .hero{padding:20px 0 6px}
  .brand{display:flex;align-items:center;gap:10px}
  .flag{font-size:26px;line-height:1}
  .hero h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
  .hero p{margin:1px 0 0;font-size:12.5px;color:var(--ink2);font-weight:600}

  .tabsbar{
    position:sticky;top:0;z-index:20;
    margin:0 -16px;padding:8px 16px 9px;
    background:rgba(251,246,239,.93);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(237,226,214,.75);
  }
  .daytabs{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 2px;scrollbar-width:none}
  .daytabs::-webkit-scrollbar{display:none}
  .daychip{
    flex:none;position:relative;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink2);
    border-radius:14px;padding:8px 13px;text-align:left;
    font-family:inherit;font-size:13px;font-weight:800;line-height:1.25;
    min-height:46px;cursor:pointer;
  }
  .daychip small{display:block;font-size:10.5px;font-weight:600;color:var(--ink2);opacity:.9;margin-top:2px}
  .daychip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .daychip.on small{color:rgba(255,255,255,.9)}
  .daychip.locked{border-style:dashed;color:#A79A8E;background:transparent}
  .daychip.locked small{color:#A79A8E}
  .daychip.touched{box-shadow:inset 3px 0 0 0 var(--ok)}
  .daychip.on.touched{box-shadow:none}

  /* ---------- generic ---------- */
  main{padding-top:14px}
  .card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:13px;box-shadow:0 2px 10px rgba(51,38,31,.05)}
  .panel-head{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(51,38,31,.05)}
  .kicker{font-size:11.5px;font-weight:800;color:var(--accent);letter-spacing:.04em}
  .panel-head h2{margin:3px 0 4px;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
  .panel-head p{margin:0;font-size:13.5px;color:var(--ink2);font-weight:500}
  .plan{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .plan span{font-size:11.5px;background:var(--accent-soft);color:var(--accent2);padding:4px 9px;border-radius:999px;font-weight:800}
  .statrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .stat{font-size:11.5px;background:var(--soft);border:1px solid var(--line);color:var(--ink2);padding:4px 9px;border-radius:999px;font-weight:700}
  .stat b{color:var(--ink);font-weight:800}
  .stat.done{background:var(--ok-soft);border-color:#CFE9DA;color:#1E5F45}

  .card h3{margin:0 0 5px;font-size:15.5px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
  .sec-num{flex:none;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
  .lead{margin:0 0 12px;font-size:13px;color:var(--ink2);font-weight:500;line-height:1.6}

  .tip{background:#FBF3E7;border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:9px 12px;font-size:12.5px;color:#6B543A;font-weight:600;margin-top:10px;line-height:1.55}
  .tip b{font-weight:800;color:#5A4327}

  /* ---------- conjugation tables ---------- */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
  .tbl-wrap + .tbl-wrap{margin-top:11px;border-top:1px dashed var(--line);padding-top:11px}
  table.conj{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
  table.conj th,table.conj td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
  table.conj thead th{font-size:15px;font-weight:800;background:var(--soft);padding:9px 3px;line-height:1.2}
  table.conj thead th small{display:block;font-size:10.5px;font-weight:700;color:var(--ink2);margin-top:1px}
  table.conj thead th:first-child{width:62px;background:transparent}
  table.conj tbody th{font-size:11.5px;font-weight:700;color:var(--ink2);background:var(--soft);white-space:nowrap;padding-left:6px}
  table.conj tbody tr:last-child th,table.conj tbody tr:last-child td{border-bottom:0}
  table.conj td{font-weight:700;letter-spacing:-.01em}
  table.conj.tight{font-size:13.5px}
  table.conj.tight thead th{font-size:14px}
  table.conj.tight th,table.conj.tight td{padding:7px 3px}
  table.conj.tight thead th:first-child{width:54px}
  table.conj.tight tbody th{font-size:11px;padding-left:5px}
  table.conj tr.outside th,table.conj tr.outside td{background:#F7F3EC}
  table.conj tr.outside td{color:#7E7166}
  .e{color:var(--accent);font-weight:800}
  .s{color:var(--teal);font-weight:800}
  .axis{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--ink2);font-weight:700}
  .axis i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .axis .e-c{background:var(--accent)}
  .axis .s-c{background:var(--teal)}

  /* ---------- boot diagram ---------- */
  .boot{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:2px 0 4px}
  .boot .b{border-radius:11px;padding:7px 6px;text-align:center;line-height:1.3}
  .boot .b small{display:block;font-size:10px;font-weight:800;opacity:.75;letter-spacing:.02em}
  .boot .b span{font-size:14px;font-weight:800}
  .boot .in{background:var(--teal-soft);color:#1F5F5C;border:1.5px solid var(--teal-line)}
  .boot .out{background:#F6F2EC;color:#8C7C70;border:1.5px dashed #DCD0C2}

  /* ---------- irregular verbs ---------- */
  .irr{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px;background:var(--soft)}
  .irr:last-child{margin-bottom:0}
  .irr-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .irr-head b{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .irr-head span{font-size:12.5px;color:var(--ink2);font-weight:700}
  .irr-badge{font-size:10px;font-weight:800;background:var(--accent-soft);color:var(--accent2);padding:2px 7px;border-radius:999px}
  .irr-forms{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .irr-f{background:#fff;border-radius:9px;padding:5px 9px;display:flex;justify-content:space-between;align-items:baseline;gap:6px;border:1px solid #F1E7DB}
  .irr-f small{font-size:10px;font-weight:700;color:var(--ink2)}
  .irr-f span{font-size:13.5px;font-weight:800}

  /* ---------- vocabulary ---------- */
  .vocab{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .vocab div{background:var(--soft);border-radius:9px;padding:6px 9px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .vocab b{font-size:13px;font-weight:800}
  .vocab span{font-size:11.5px;color:var(--ink2);font-weight:600;text-align:right}

  /* ---------- upcoming ---------- */
  .up-list{list-style:none;margin:0;padding:0}
  .up-list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .up-list li:last-child{border-bottom:0}
  .up-list .num{flex:none;width:24px;height:24px;border-radius:50%;background:#F1EAE0;color:#9A8A7C;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .up-list .txt{flex:1;min-width:0}
  .up-list b{display:block;font-size:13.5px;font-weight:800}
  .up-list small{display:block;font-size:11.5px;color:var(--ink2);font-weight:600}
  .up-list .lock{flex:none;font-size:10.5px;font-weight:800;color:#A79A8E;background:#F4EEE6;padding:3px 8px;border-radius:999px}

  /* ---------- flashcards ---------- */
  .fc-top .lead{margin-bottom:8px}
  .fc-bar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .fc-bar .kicker{font-size:11.5px}
  .fc-bar .cnt{font-size:11.5px;font-weight:800;color:var(--ink2)}
  .progress{height:7px;border-radius:999px;background:#F0E8DE;overflow:hidden}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,#5FA98B,#2E7D5B);border-radius:999px;transition:width .35s ease}
  .fc-scene{perspective:1400px;margin:2px 0 12px}
  .fc{position:relative;height:272px;transform-style:preserve-3d;transition:transform .52s cubic-bezier(.4,.08,.2,1);cursor:pointer}
  .fc.flipped{transform:rotateY(180deg)}
  .fc-face{
    position:absolute;inset:0;border-radius:22px;padding:18px 18px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    -webkit-backface-visibility:hidden;backface-visibility:hidden;
    overflow:hidden;
  }
  .fc-front{background:#fff;border:1.5px solid var(--line);box-shadow:0 6px 20px rgba(51,38,31,.07)}
  .fc-back{background:var(--teal-soft);border:1.5px solid var(--teal-line);transform:rotateY(180deg);box-shadow:0 6px 20px rgba(31,95,92,.1)}
  .subjchip{font-size:11.5px;font-weight:800;color:var(--accent2);background:var(--accent-soft);padding:3px 11px;border-radius:999px;margin-bottom:10px}
  .fc-verb{font-size:33px;font-weight:800;letter-spacing:-.02em;line-height:1.15;word-break:break-word}
  .fc-meaning{font-size:14.5px;color:var(--ink2);font-weight:700;margin-top:6px}
  .fc-tap{position:absolute;bottom:14px;left:0;right:0;font-size:11.5px;font-weight:700;color:#B4A596}
  .fc-label{font-size:11px;font-weight:800;color:#2F7E7A;letter-spacing:.08em;margin-bottom:4px}
  .fc-answer{font-size:31px;font-weight:800;color:#1F5F5C;letter-spacing:-.02em;line-height:1.15;word-break:break-word}
  .fc-ex{font-size:13px;font-weight:700;color:#2A5E5B;margin-top:12px;line-height:1.5;padding:0 2px}
  .fc-exko{font-size:11.5px;font-weight:600;color:#5D8D89;margin-top:4px}
  .fc-note{font-size:10.5px;font-weight:800;color:#2F7E7A;background:rgba(255,255,255,.7);padding:3px 9px;border-radius:999px;margin-top:10px}
  .covered{font-size:11.5px;color:var(--ink2);font-weight:700;text-align:center;margin:2px 0 0}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{
    font-family:inherit;border:0;border-radius:15px;padding:15px 16px;font-size:15.5px;font-weight:800;
    min-height:54px;width:100%;background:var(--accent);color:#fff;cursor:pointer;
    box-shadow:0 5px 16px rgba(201,97,60,.24);touch-action:manipulation;
  }
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
  .btn.ok{background:var(--ok);box-shadow:0 5px 16px rgba(46,125,91,.22)}
  .btn.soft{background:var(--soft);color:var(--ink2);border:1.5px solid var(--line);box-shadow:none}
  .done-screen{text-align:center;padding:22px 16px}
  .done-emoji{font-size:40px;line-height:1;margin-bottom:6px}
  .done-screen h3{display:block;justify-content:center;font-size:17px;margin-bottom:6px}
  .done-screen p{font-size:13px;color:var(--ink2);font-weight:600;margin:0 0 14px}
  .done-screen .btn{margin-top:8px}

  /* ---------- quiz ---------- */
  .q{background:#fff;border-radius:18px;padding:14px;margin-bottom:11px;border:1.5px solid transparent;box-shadow:0 2px 10px rgba(51,38,31,.05)}
  .q.ok{border-color:#BCE3CC}
  .q.bad{border-color:#F3C3BC}
  .q-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .qnum{font-size:11px;font-weight:800;color:var(--ink2);letter-spacing:.06em}
  .qmark{font-size:13px;font-weight:800}
  .qmark.ok{color:var(--ok)}
  .qmark.bad{color:var(--bad)}
  .stem{font-size:15px;font-weight:700;line-height:2.1;margin:4px 0 8px;letter-spacing:-.01em}
  .blank{
    font-family:inherit;font-size:16px;line-height:1.25;font-weight:800;color:var(--accent);
    background:var(--soft);border:0;border-bottom:2px solid #D9CDBF;border-radius:8px 8px 2px 2px;
    padding:6px 7px;text-align:center;min-height:38px;margin:0 2px;
    vertical-align:middle;-webkit-appearance:none;appearance:none;
  }
  .blank:focus{outline:none;border-color:var(--accent);background:var(--accent-soft)}
  .blank.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
  .blank.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
  .qacts{display:flex;gap:7px;flex-wrap:wrap}
  .mini{
    font-family:inherit;font-size:12px;font-weight:800;color:var(--ink2);
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;min-height:36px;cursor:pointer;
  }
  .mini.on{background:var(--teal-soft);border-color:var(--teal-line);color:#21605D}
  .hint{background:#FDF6E3;border-radius:10px;padding:9px 11px;font-size:12.5px;font-weight:600;color:#7A5E20;margin-top:9px}
  .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .opt{
    font-family:inherit;font-size:13.5px;font-weight:800;color:var(--ink);
    background:var(--soft);border:1.5px solid var(--line);border-radius:11px;padding:8px 13px;min-height:42px;cursor:pointer;
    touch-action:manipulation;
  }
  .opt.sel{background:var(--accent);border-color:var(--accent);color:#fff}
  .res{border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-top:9px;line-height:1.55}
  .res.ok{background:var(--ok-soft);color:#1E5F45}
  .res.bad{background:var(--bad-soft);color:#942F22}
  .res b{font-weight:800}
  .res .full{margin-top:3px;color:inherit;opacity:.95}
  .res .expl{margin-top:3px;opacity:.85}
  .score{
    background:linear-gradient(140deg,#C9613C,#A64B2C);color:#fff;border-radius:20px;
    padding:18px 16px;text-align:center;margin-bottom:13px;box-shadow:0 6px 20px rgba(201,97,60,.22);
  }
  .score .big{font-size:36px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
  .score .big small{font-size:16px;font-weight:800;opacity:.85}
  .score .msg{font-size:13px;font-weight:700;opacity:.95;margin-top:2px}
  .score .sub{font-size:11.5px;font-weight:600;opacity:.8;margin-top:4px}
  .quizfoot{margin-top:14px}

  .foot{text-align:center;font-size:11px;color:#B0A294;font-weight:600;padding:6px 0 10px;line-height:1.6}

  /* ---------- bottom mode nav ---------- */
  .modenav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:8px 12px calc(9px + env(safe-area-inset-bottom));
    background:rgba(251,246,239,.92);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid rgba(237,226,214,.85);
  }
  .modenav-inner{
    max-width:456px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
    background:#fff;border-radius:17px;padding:5px;box-shadow:0 3px 14px rgba(51,38,31,.08);
  }
  .mode-btn{
    font-family:inherit;border:0;background:transparent;border-radius:13px;
    padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;
    font-size:11.5px;font-weight:800;color:var(--ink2);cursor:pointer;min-height:50px;justify-content:center;
    touch-action:manipulation;
  }
  .mode-btn .ic{font-size:15px;line-height:1.1}
  .mode-btn.on{background:var(--accent);color:#fff}
  .mode-btn.on .ic{color:#fff}

  .toast{
    position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);opacity:0;pointer-events:none;
    background:rgba(51,38,31,.93);color:#fff;font-size:12.5px;font-weight:700;
    padding:10px 16px;border-radius:999px;z-index:60;max-width:86vw;text-align:center;
    transition:opacity .22s ease,transform .22s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:360px){
    .fc-verb{font-size:29px}
    .fc-answer{font-size:27px}
    .stem{font-size:14px}
    .vocab{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<noscript><div style="background:#FDECEA;color:#942F22;padding:12px 16px;font-size:13px;font-weight:700;text-align:center">자바스크립트가 꺼져 있어요. Safari에서 이 파일을 열어 주세요.</div></noscript>
<div class="app">
  <header class="hero">
    <div class="brand">
      <span class="flag" aria-hidden="true">🇪🇸</span>
      <div>
        <h1>스페인어 동사변형</h1>
        <p>B1에서 다시, 하루 20분 기초부터</p>
      </div>
    </div>
  </header>

  <div class="tabsbar">
    <div class="daytabs" id="dayTabs" role="tablist" aria-label="일차 선택"></div>
  </div>

  <main id="main"></main>

  <footer class="foot">진행 상황은 이 기기에만 저장돼요 · 인터넷 없이도 열려요</footer>
</div>

<nav class="modenav" aria-label="학습 모드">
  <div class="modenav-inner" id="modeTabs"></div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ============ 데이터 ============ */
  var SUBJ = ["yo", "tú", "él / ella", "nosotros", "vosotros", "ellos"];
  var SHORT = ["yo", "tú", "él/ella", "nosotros", "vosotros", "ellos"];

  var DATA = {
    days: {
      d1: {
        label: "1일차",
        title: "현재 규칙 & 기초 불규칙",
        summary: "규칙동사 3패턴(-ar/-er/-ir)과 ser·estar·ir·tener를 한 번에 잡아요.",
        cards: [
          { v: "hablar", m: "말하다", s: "yo", a: "hablo", ex: "Hablo español un poco.", ko: "나는 스페인어를 조금 말해요.", n: "-ar 규칙 · yo → -o" },
          { v: "comer", m: "먹다", s: "tú", a: "comes", ex: "¿Comes carne?", ko: "너 고기 먹어?", n: "-er 규칙 · tú → -es" },
          { v: "vivir", m: "살다", s: "nosotros", a: "vivimos", ex: "Vivimos en Seúl.", ko: "우리는 서울에 살아요.", n: "-ir 규칙 · nosotros → -imos" },

    h += '<p class="lead">오늘 배운 현재시제 위에 이 순서로 쌓여요. 매일 같은 시간, 20분씩.</p><ol class="up-list">';

  /* ============ 플래시카드 ============ */
  function initCards(force) {
    var d = DATA.days[state.day];
    var p = progOf(state.day);
    if (force || !cards || cards.day !== state.day) {
      var known = {};
      for (var i = 0; i < p.known.length; i++) known[p.known[i]] = true;
      var queue = [];
      for (var j = 0; j < d.cards.length; j++) {
        var id = state.day + "c" + j;
        if (!known[id]) queue.push(id);
      }
      cards = { day: state.day, known: known, queue: shuffle(queue), flipped: false };
    }
  }

  function cardIndexFromId(id) {
    return parseInt(String(id).replace(/^.*c/, ""), 10);
  }

  function cardsInnerHTML() {
    var d = DATA.days[state.day];
    var total = d.cards.length;
    var knownCount = 0;
    for (var i = 0; i < total; i++) {
      if (cards.known[state.day + "c" + i]) knownCount++;
    }
    var pct = Math.round((knownCount / total) * 100);

    var h = "";
    h += '<section class="card fc-top">';
    h += '<div class="fc-bar"><span class="kicker">' + (cards.queue.length ? "플래시카드 " + (total - knownCount) + "장 남음" : "플래시카드 완료") + "</span>";
    h += '<span class="cnt">외운 카드 ' + knownCount + " / " + total + "</span></div>";
    h += '<div class="progress"><i style="width:' + pct + '%"></i></div>';
    h += "</section>";

    if (!cards.queue.length) {
      h += '<section class="card done-screen"><div class="done-emoji">🎉</div>';
      h += "<h3>이 일차 카드를 다 봤어요!</h3>";
      h += "<p>카드 " + total + "장을 모두 확인했어요 · 이제 퀴즈로 확인해 볼까요?</p>";
      h += '<button type="button" class="btn" data-act="gotoquiz">퀴즈로 확인하기</button>';
      h += '<button type="button" class="btn ghost" data-act="restart">전체 카드 한 번 더</button>';
      h += "</section>";
      return h;
    }

    var id = cards.queue[0];
    var c = d.cards[cardIndexFromId(id)];
    h += '<div class="fc-scene"><div class="fc' + (cards.flipped ? " flipped" : "") + '" id="fc" data-act="flip" role="button" tabindex="0" aria-label="카드를 눌러 정답 보기">';
    h += '<div class="fc-face fc-front">';
    h += '<span class="subjchip">' + esc(c.s) + "</span>";
    h += '<div class="fc-verb">' + esc(c.v) + "</div>";
    h += '<div class="fc-meaning">' + esc(c.m) + "</div>";
    h += '<div class="fc-tap">탭해서 정답 보기 ↻</div>';
    h += "</div>";
    h += '<div class="fc-face fc-back">';
    h += '<span class="fc-label">정답</span>';
    h += '<div class="fc-answer">' + mk(c.a) + "</div>";
    h += '<div class="fc-ex">«' + esc(c.ex) + "»</div>";
    h += '<div class="fc-exko">' + esc(c.ko) + "</div>";
    if (c.n) h += '<div class="fc-note">' + esc(c.n) + "</div>";
    h += "</div></div></div>";

    h += '<div class="btn-row">';
    h += '<button type="button" class="btn ghost" data-act="review">다시 볼래요</button>';
    h += '<button type="button" class="btn ok" data-act="known">외웠어요</button>';
    h += "</div>";
    h += '<p class="covered">카드를 누르면 정답이 보여요 · 남은 카드 ' + cards.queue.length + "장</p>";
    return h;
  }

  function renderCardsStage() {
    var host = document.getElementById("cardsHost");
    if (!host) { render(); return; }
    host.innerHTML = cardsInnerHTML();
  }

  function flipCard() {
    var el = document.getElementById("fc");
    if (!el) return;
    cards.flipped = !cards.flipped;
    if (cards.flipped) el.classList.add("flipped");
    else el.classList.remove("flipped");
  }

  function markKnown() {
    if (!cards.queue.length) return;
    var id = cards.queue.shift();
    cards.known[id] = true;
    cards.flipped = false;
    var p = progOf(state.day);
    if (p.known.indexOf(id) < 0) {
      p.known.push(id);
      saveProg();
    }
    renderCardsStage();
    renderDayTabs();
    renderPanelHead();
    if (!cards.queue.length) toast("카드 전부 완료! 퀴즈로 확인해 보세요");
  }

  function markReview() {
    if (cards.queue.length < 2) {
      cards.flipped = false;
      renderCardsStage();
      toast("이 카드만 남았어요. 외웠으면 '외웠어요'를 눌러 주세요");
      return;
    }
    var id = cards.queue.shift();
    cards.queue.push(id);
    cards.flipped = false;
    renderCardsStage();
  }

  /* ============ 퀴즈 ============ */
  function initQuiz() {
    var d = DATA.days[state.day];
    if (!quiz || quiz.day !== state.day) {
      var answers = [];
      for (var i = 0; i < d.quiz.length; i++) {
        var row = [];
        for (var b = 0; b < d.quiz[i].answers.length; b++) row.push("");
        answers.push(row);
      }
      quiz = { day: state.day, answers: answers, results: null, hints: {}, opts: {} };
    }
  }

  function blankWidth(item, b) {
    var maxLen = 4;
    for (var i = 0; i < item.answers[b].length; i++) {
      if (item.answers[b][i].length > maxLen) maxLen = item.answers[b][i].length;
    }
    var w = maxLen * 10 + 34;
    if (w < 92) w = 92;
    if (w > 190) w = 190;
    return w;
  }

  function blankHTML(item, i, b) {
    var val = quiz.answers[i][b] || "";
    var cls = "";
    if (quiz.results) cls = quiz.results[i].blanks[b] ? " ok" : " bad";
    return '<input class="blank' + cls + '" type="text" inputmode="text" autocomplete="off" autocorrect="off" ' +
      'autocapitalize="off" spellcheck="false" data-q="' + i + '" data-b="' + b + '" ' +
      'value="' + escAttr(val) + '" style="width:' + blankWidth(item, b) + 'px" aria-label="' + (i + 1) + "번 문제 " + (b + 1) + '번 빈칸">';
  }

  function stemHTML(item, i) {
    var parts = item.text.split("{}");
    var h = "";
    for (var b = 0; b < parts.length; b++) {
      h += esc(parts[b]);
      if (b < parts.length - 1) h += blankHTML(item, i, b);
    }
    return h;
  }

  function solutionHTML(item) {
    var parts = item.text.split("{}");
    var h = "";
    for (var b = 0; b < parts.length; b++) {
      h += esc(parts[b]);
      if (b < parts.length - 1) h += "<b>" + esc(item.answers[b][0]) + "</b>";
    }
    return h;
  }

  function answerText(item) {
    var out = [];
    for (var b = 0; b < item.answers.length; b++) out.push("«" + item.answers[b][0] + "»");
    return out.join(" / ");
  }

  function optsHTML(item, i) {
    var h = "";
    for (var b = 0; b < item.options.length; b++) {
      if (!quiz.opts[i]) continue;
      h += '<div class="opts">';
      for (var o = 0; o < item.options[b].length; o++) {
        var opt = item.options[b][o];
        var sel = norm(quiz.answers[i][b]) === norm(opt) ? " sel" : "";
        h += '<button type="button" class="opt' + sel + '" data-opt="' + i + "|" + b + "|" + escAttr(opt) + '">' + esc(opt) + "</button>";
      }
      h += "</div>";
    }
    return h;
  }

  function questionHTML(item, i) {
    var res = quiz.results ? quiz.results[i] : null;
    var cls = res ? (res.ok ? " ok" : " bad") : "";
    var h = '<div class="q' + cls + '">';
    h += '<div class="q-head"><span class="qnum">Q' + (i + 1) + "</span>";
    if (res) h += '<span class="qmark ' + (res.ok ? "ok" : "bad") + '">' + (res.ok ? "✓ 정답" : "✗ 오답") + "</span>";
    h += "</div>";
    h += '<div class="stem">' + stemHTML(item, i) + "</div>";
    h += '<div class="qacts">';
    h += '<button type="button" class="mini' + (quiz.hints[i] ? " on" : "") + '" data-act="hint" data-i="' + i + '">💡 힌트</button>';
    h += '<button type="button" class="mini' + (quiz.opts[i] ? " on" : "") + '" data-act="opts" data-i="' + i + '">' + (quiz.opts[i] ? "선택지 닫기" : "선택지 보기") + "</button>";
    h += "</div>";
    if (quiz.hints[i]) h += '<div class="hint">' + esc(item.hint) + "</div>";
    h += optsHTML(item, i);
    if (res) {
      if (res.ok) {
        h += '<div class="res ok"><b>✓ 맞았어요!</b><div class="expl">' + esc(item.expl) + "</div></div>";
      } else {
        h += '<div class="res bad"><b>✗ 정답은 ' + esc(answerText(item)) + "</b>";
        h += '<div class="full">완성: ' + solutionHTML(item) + "</div>";
        h += '<div class="expl">' + esc(item.expl) + "</div></div>";
      }
    }
    h += "</div>";
    return h;
  }

  function scoreHTML() {
    var total = quiz.results.length;
    var n = 0;
    for (var i = 0; i < quiz.results.length; i++) if (quiz.results[i].ok) n++;
    var msg = n === total ? "완벽해요! 오늘 분량은 여기까지 🎉"
      : n >= total - 2 ? "아주 좋아요! 틀린 문제만 다시 보면 돼요 👏"
      : n >= total / 2 ? "좋아요, 조금만 더 다듬으면 완성돼요"
      : "괜찮아요. 개념 정리로 한 번 돌아가 볼까요?";
    var best = progOf(state.day).best;
    var h = '<section class="score">';
    h += '<div class="big">' + n + "<small>/" + total + "</small></div>";
    h += '<div class="msg">' + esc(msg) + "</div>";
    h += '<div class="sub">최고 기록 ' + best + "/" + total + " · 점수는 이 기기에 저장돼요</div>";
    h += "</section>";
    return h;
  }

  function quizInnerHTML() {
    var d = DATA.days[state.day];
    var h = "";
    if (quiz.results) h += scoreHTML();
    else {
      h += '<section class="card"><h3>실전 퀴즈 · 8문제</h3>';
      h += '<p class="lead">빈칸에 답을 직접 입력해 보세요. 막히면 💡 힌트, 보기가 필요하면 보기 버튼을 누르면 돼요. 다 풀고 <b>채점하기</b>를 누르면 바로 정답과 해설이 나와요.</p>';
      h += '<div class="tip"><b>채점 안내</b> · 띄어쓰기와 마침표는 무시하고, 악센트(á, é, í) 없이 입력해도 정답으로 처리해요. 한국어로 외우기보다 <b>소리 내어 읽으며</b> 입력해 보세요.</div>';
      h += "</section>";
    }
    for (var i = 0; i < d.quiz.length; i++) h += questionHTML(d.quiz[i], i);
    h += '<div class="quizfoot">';
    if (quiz.results) h += '<button type="button" class="btn ghost" data-act="reset">다시 풀기</button>';
    else h += '<button type="button" class="btn" data-act="grade">채점하기</button>';
    h += "</div>";
    return h;
  }

  function renderQuizStage() {
    var host = document.getElementById("quizHost");
    if (!host) { render(); return; }
    host.innerHTML = quizInnerHTML();
  }

  function collectAnswers() {
    var inputs = document.querySelectorAll(".blank");
    for (var i = 0; i < inputs.length; i++) {
      var q = parseInt(inputs[i].getAttribute("data-q"), 10);
      var b = parseInt(inputs[i].getAttribute("data-b"), 10);
      quiz.answers[q][b] = inputs[i].value;
    }
  }

  function grade() {
    collectAnswers();
    var d = DATA.days[state.day];
    var results = [];
    for (var i = 0; i < d.quiz.length; i++) {
      var item = d.quiz[i];
      var blanks = [];
      var allOk = true;
      for (var b = 0; b < item.answers.length; b++) {
        var val = norm(quiz.answers[i][b]);
        var ok = false;
        if (val !== "") {
          for (var a = 0; a < item.answers[b].length; a++) {
            if (norm(item.answers[b][a]) === val) { ok = true; break; }
          }
        }
        blanks.push(ok);
        if (!ok) allOk = false;
      }
      results.push({ ok: allOk, blanks: blanks });
    }
    quiz.results = results;

    var score = 0;
    for (var r = 0; r < results.length; r++) if (results[r].ok) score++;
    var p = progOf(state.day);
    p.last = score;
    if (score > p.best) p.best = score;
    saveProg();

    renderQuizStage();
    renderDayTabs();
    renderPanelHead();
    var sc = document.querySelector(".score");
    if (sc && sc.scrollIntoView) {
      window.scrollTo({ top: sc.getBoundingClientRect().top + window.pageYOffset - 70, behavior: "smooth" });
    }
  }

  function resetQuiz() {
    quiz.results = null;
    var d = DATA.days[state.day];
    var answers = [];
    for (var i = 0; i < d.quiz.length; i++) {
      var row = [];
      for (var b = 0; b < d.quiz[i].answers.length; b++) row.push("");
      answers.push(row);
    }
    quiz.answers = answers;
    quiz.hints = {};
    quiz.opts = {};
    renderQuizStage();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ============ 렌더 ============ */
  function renderPanelHead() {
    var host = document.getElementById("panelHead");
    if (!host) return;
    host.innerHTML = panelHeadHTML();
  }

  function render() {
    var main = document.getElementById("main");
    var h = '<div id="panelHead">' + panelHeadHTML() + "</div>";
    if (state.mode === "concept") {
      h += conceptsHTML();
      h += upcomingHTML();
    } else if (state.mode === "cards") {
      initCards(false);
      h += '<div id="cardsHost">' + cardsInnerHTML() + "</div>";
    } else {
      initQuiz();
      h += '<div id="quizHost">' + quizInnerHTML() + "</div>";
    }
    main.innerHTML = h;
    renderDayTabs();
    renderModeTabs();
    saveState();
  }

  /* ============ 이벤트 ============ */
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    var el = t && t.closest ? t.closest("[data-day],[data-locked],[data-mode],[data-act],[data-opt]") : null;
    if (!el) return;

    if (el.hasAttribute("data-locked")) {
      var n = el.getAttribute("data-locked");
      toast(n + "일차는 곧 추가될 예정이에요 🔒");
      return;
    }
    if (el.hasAttribute("data-day")) {
      var day = el.getAttribute("data-day");
      if (day !== state.day) {
        state.day = day;
        quiz = null;
        cards = null;
        render();
        window.scrollTo({ top: 0, behavior: "auto" });
      }
      return;
    }
    if (el.hasAttribute("data-mode")) {
      var mode = el.getAttribute("data-mode");
      if (mode !== state.mode) {
        if (state.mode === "quiz" && quiz && !quiz.results) collectAnswers();
        state.mode = mode;
        render();
        window.scrollTo({ top: 0, behavior: "auto" });
      }
      return;
    }
    if (el.hasAttribute("data-opt")) {
      var parts = el.getAttribute("data-opt").split("|");
      var qi = parseInt(parts[0], 10);
      var bi = parseInt(parts[1], 10);
      var value = parts.slice(2).join("|");
      quiz.answers[qi][bi] = value;
      var inp = document.querySelector('.blank[data-q="' + qi + '"][data-b="' + bi + '"]');
      if (inp) inp.value = value;
      var sibs = el.parentNode.querySelectorAll(".opt");
      for (var k = 0; k < sibs.length; k++) sibs[k].classList.remove("sel");
      el.classList.add("sel");
      return;
    }

    var act = el.getAttribute("data-act");
    if (!act) return;

    if (act === "flip") { flipCard(); return; }
    if (act === "known") { markKnown(); return; }
    if (act === "review") { markReview(); return; }
    if (act === "restart") {
      cards.flipped = false;
      var d = DATA.days[state.day];
      var ids = [];
      for (var i = 0; i < d.cards.length; i++) ids.push(state.day + "c" + i);
      cards.queue = shuffle(ids);
      renderCardsStage();
      toast("전체 카드를 처음부터 다시 볼게요");
      return;
    }
    if (act === "gotoquiz") {
      state.mode = "quiz";
      render();
      window.scrollTo({ top: 0, behavior: "auto" });
      return;
    }
    if (act === "hint") {
      var hi = parseInt(el.getAttribute("data-i"), 10);
      quiz.hints[hi] = !quiz.hints[hi];
      collectAnswers();
      renderQuizStage();
      return;
    }
    if (act === "opts") {
      var oi = parseInt(el.getAttribute("data-i"), 10);
      quiz.opts[oi] = !quiz.opts[oi];
      collectAnswers();
      renderQuizStage();
      return;
    }
    if (act === "grade") { grade(); return; }
    if (act === "reset") { resetQuiz(); return; }
  });

  document.addEventListener("input", function (ev) {
    var t = ev.target;
    if (!t || !t.classList || !t.classList.contains("blank")) return;
    var q = parseInt(t.getAttribute("data-q"), 10);
    var b = parseInt(t.getAttribute("data-b"), 10);
    quiz.answers[q][b] = t.value;
  });

  document.addEventListener("keydown", function (ev) {
    var t = ev.target;
    if (t && t.classList && t.classList.contains("blank") && ev.key === "Enter") {
      ev.preventDefault();
      var all = Array.prototype.slice.call(document.querySelectorAll(".blank"));
      var idx = all.indexOf(t);
      if (idx >= 0 && idx < all.length - 1) all[idx + 1].focus();
      else {
        var btn = document.querySelector('[data-act="grade"]');
        if (btn) btn.click();
      }
    }
    if (t && t.id === "fc" && (ev.key === "Enter" || ev.key === " ")) {
      ev.preventDefault();
      flipCard();
    }
  });

  /* ============ 시작 ============ */
  loadAll();
  render();
})();
</script>
</body>
</html>
